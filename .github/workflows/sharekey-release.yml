name: Sharekey mobile release

on:
  push:
    branches: [codex/m-3153-kotlin-2.2.10]
    tags: ['v*-sharekey.*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharekey-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-analysis:
    uses: ./.github/workflows/include-static-analysis.yml

  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.workers.max=3
      CCACHE_DIR: ${{ github.workspace }}/build/ccache-mobile
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.17.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false
      - name: Restore compiler cache
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-mobile
          key: realm-mobile-macos15-xcode16.4-ndk27-v1-${{ github.sha }}
          restore-keys: realm-mobile-macos15-xcode16.4-ndk27-v1-
      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ccache
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          curl --fail --location --retry 3 \
            https://downloads.sourceforge.net/project/swig/swig/swig-4.3.1/swig-4.3.1.tar.gz \
            -o "$RUNNER_TEMP/swig.tar.gz"
          echo "44fc829f70f1e17d635a2b4d69acab38896699ecc24aa023e516e0eabbec61b8  $RUNNER_TEMP/swig.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/swig.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/swig-4.3.1"
          ./configure --prefix="$RUNNER_TEMP/realm-tools" --without-pcre --without-alllang
          make -j3
          make install
          echo "$RUNNER_TEMP/realm-tools/bin" >> "$GITHUB_PATH"
      - name: Test packaging failure recovery
        run: python3 -B -m unittest discover -s tools/tests -v
      - name: Build SDK, test JVM and package Maven repository
        run: bash tools/build-mobile-release.sh
      - name: Save compiler cache
        if: always() && !cancelled() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ccache-mobile
          key: realm-mobile-macos15-xcode16.4-ndk27-v1-${{ github.sha }}
      - name: Save release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-package
          path: |
            build/mobile-package/*.tgz
            build/mobile-package/*.sha256
            build/mobile-package/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-jvm-reports
          path: |
            packages/*/build/test-results/
            integration-tests/gradle/current/*/build/test-results/
          retention-days: 14

  android-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api-level: [25, 35]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-package
          path: build/mobile-package
      - name: Install the packaged SDK and Android platform
        shell: bash
        run: |
          set -euo pipefail
          cd build/mobile-package
          sha256sum -c *.sha256
          tar -xzf *.tgz
          (cd package && sha256sum -c SHA256SUMS)
          mkdir -p ../../packages/build
          mv package/maven ../../packages/build/m2-buildrepo
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test published Android SDK
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/test-published-android.sh '${{ matrix.api-level }}'
      - name: Save Android reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-android-reports-api-${{ matrix.api-level }}
          path: |
            packages/test-base/build/reports/androidTests/
            packages/test-base/build/outputs/androidTest-results/
            examples/min-android-sample/app/build/outputs/mapping/release/
          retention-days: 14

  release:
    needs: [static-analysis, build, android-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-package
          path: bundle
      - name: Publish immutable-version assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd bundle
          sha256sum -c *.sha256
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('provenance.json').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + data['version']
          assert os.environ['GITHUB_SHA'] == data['sourceCommit']
          Path('notes.md').write_text(
              'Prebuilt Realm Kotlin for the Sharekey Android app.\n\n'
              '- Maven group: `com.sharekey.realm.kotlin`\n'
              '- Kotlin compiler: `' + data['kotlin'] + '`\n'
              '- SDK source: `' + data['sourceCommit'] + '`\n'
              '- Realm Core: `' + data['coreCommit'] + '`\n\n'
              'Contains four Android ABIs and macOS JVM native runtime. Linux/Windows JVM and '
              'Kotlin/Native Apple SDK publications are not included. '
              'Install the versioned `.tgz` URL with Yarn and configure Gradle to read its `maven/` directory.\n\n'
              'Validated by compiler/JVM tests, independent consumers, Android instrumentation and 16 KB ELF checks.\n'
          )
          PY
          # Never overwrite an existing release or its assets.
          gh release create "$RELEASE_TAG" *.tgz *.sha256 provenance.json \
            --verify-tag --title "Sharekey Realm Kotlin ${RELEASE_TAG#v}" --notes-file notes.md
