name: Sharekey mobile release

on:
  push:
    branches: [codex/m-3153-kotlin-2.2.10]
    tags: ['v*-sharekey.*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharekey-mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-analysis:
    uses: ./.github/workflows/include-static-analysis.yml

  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      GRADLE_OPTS: -Dorg.gradle.workers.max=3
      CCACHE_DIR: ${{ github.workspace }}/.ccache-mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install native build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ccache
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          curl --fail --location --retry 3 \
            https://downloads.sourceforge.net/project/swig/swig/swig-4.3.1/swig-4.3.1.tar.gz \
            -o "$RUNNER_TEMP/swig.tar.gz"
          echo "44fc829f70f1e17d635a2b4d69acab38896699ecc24aa023e516e0eabbec61b8  $RUNNER_TEMP/swig.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/swig.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/swig-4.3.1"
          ./configure --prefix="$RUNNER_TEMP/realm-tools" --without-pcre --without-alllang
          make -j3
          make install
          echo "$RUNNER_TEMP/realm-tools/bin" >> "$GITHUB_PATH"
      - name: Build SDK, test JVM and package Maven repository
        run: bash tools/build-mobile-release.sh
      - name: Save release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-package
          path: |
            build/mobile-package/*.tgz
            build/mobile-package/*.sha256
            build/mobile-package/provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-jvm-reports
          path: |
            packages/*/build/test-results/
            integration-tests/gradle/current/*/build/test-results/
          retention-days: 14

  android-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mobile-package
          path: build/mobile-package
      - name: Install the packaged SDK and Android platform
        shell: bash
        run: |
          set -euo pipefail
          cd build/mobile-package
          sha256sum -c *.sha256
          tar -xzf *.tgz
          (cd package && sha256sum -c SHA256SUMS)
          mkdir -p ../../packages/build
          mv package/maven ../../packages/build/m2-buildrepo
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test published Android SDK
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew -p packages :test-base:connectedAndroidTest -PincludeSdkModules=false -Prealm.kotlin.buildRealmCore=false --no-daemon --stacktrace
      - name: Save Android reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-android-reports
          path: |
            packages/test-base/build/reports/androidTests/
            packages/test-base/build/outputs/androidTest-results/
          retention-days: 14

  release:
    needs: [static-analysis, build, android-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mobile-package
          path: bundle
      - name: Publish immutable-version assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd bundle
          sha256sum -c *.sha256
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('provenance.json').read_text())
          assert os.environ['RELEASE_TAG'] == 'v' + data['version']
          assert os.environ['GITHUB_SHA'] == data['sourceCommit']
          Path('notes.md').write_text(
              'Prebuilt Realm Kotlin for the Sharekey Android app.\n\n'
              '- Maven group: `com.sharekey.realm.kotlin`\n'
              '- Kotlin compiler: `' + data['kotlin'] + '`\n'
              '- SDK source: `' + data['sourceCommit'] + '`\n'
              '- Realm Core: `' + data['coreCommit'] + '`\n\n'
              'Contains four Android ABIs and macOS JVM native runtime. Linux/Windows JVM and '
              'Kotlin/Native Apple SDK publications are not included. '
              'Install the versioned `.tgz` URL with Yarn and configure Gradle to read its `maven/` directory.\n\n'
              'Validated by compiler/JVM tests, independent consumers, Android instrumentation and 16 KB ELF checks.\n'
          )
          PY
          # Never overwrite an existing release or its assets.
          gh release create "$RELEASE_TAG" *.tgz *.sha256 provenance.json \
            --verify-tag --title "Sharekey Realm Kotlin ${RELEASE_TAG#v}" --notes-file notes.md
