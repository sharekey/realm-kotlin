  build-benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle and task/dependency caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Restore m2-buildrepo
        uses: actions/download-artifact@v4
        with:
          name: all-packages-${{ inputs.version-label }}
          path: ./packages/build/m2-buildrepo 

      - name: Build benchmarks
        working-directory: benchmarks
        run: ./gradlew assemble :androidApp:assembleReleaseAndroidTest :jvmApp:jmhJar

  gradle-plugin-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, ubuntu-24.04]
        # Kotlin 2.2.10 requires Gradle 7.6.3+. Older fixtures remain historical sources.
        type: [current]
        include:
          - type: current
            path: integration-tests/gradle/current
            arguments: :single-platform:connectedDebugAndroidTest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle and task/dependency caching
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Restore m2-buildrepo
        uses: actions/download-artifact@v4
        with:
          name: all-packages-${{ inputs.version-label }}
          path: ./packages/build/m2-buildrepo 

      # - name: AVD cache
      #   uses: actions/cache@v4
