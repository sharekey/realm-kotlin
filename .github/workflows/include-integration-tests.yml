      #     disable-animations: true
      #     channel: canary
      #     script: echo "Generated AVD snapshot for caching."

      - name: Prepare Android emulator with KVM
        if: runner.os == 'Linux'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Gradle Plugin Test project
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          disable-animations: true
          api-level: 35
          target: google_apis
          # target: aosp_atd
          arch: x86_64        
          # profile: Nexus 6
          script: cd examples/realm-java-compatibility && ./gradlew connectedAndroidTest -PincludeSdkModules=false --info

